[workspace]
members = [
    "cli",
    "core",
    "data",
    "arenabuddy",
    "server",
    "web",
    "metagame",
]
resolver = "3"

[workspace.package]
authors = ["Grant Azure <azure.grant@gmail.com>"]
description = "MTGA companion app"
categories = []
version = "0.1.0"
repository = "https://github.com/gazure/arenabuddy"
edition = "2024"
rust-version = "1.96"
keywords = []
license = "MIT"

[workspace.dependencies]
arenabuddy_core = { path = "core" }
arenabuddy_data = { path = "data" }
arenabuddy_metagame = { path = "metagame" }
anyhow = "1.0.104"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde", "wasmbind"] }
clap = { version = "4.6.7", features = ["derive"] }
console-subscriber = "0.5.0"
ctrlc = "3.5.2"
derive_builder = "0.20.2"
dirs = "7.0.0"
dioxus = { version = "0.8.0-alpha.1" }
dotenvy = "0.15.7"
google-sheets4 = { version = "7.0.0" }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
itertools = "0.15.0"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
notify = "8.2.0"
open = "5.4.4"
postgresql_embedded = { version = "0.21.0", features = ["bundled"] }
prost = "0.14.4"
prost-build = { version = "0.14.4", features = ["format"] }
prost-types = "0.14.4"
tonic = { version = "0.14.6", features = ["tls-ring", "tls-native-roots"] }
tonic-build = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
rand = { version = "0.10.3" }
regex = "1.13.1"
rfd = { version = "0.17.2", default-features = false }
reqwest = { version = "0.13.5", features = [
    "form",
    "json",
    "stream",
    "query",
    "default-tls",
] }
# SQLx 0.9 requires libsqlite3-sys <0.38; rusqlite 0.40 requires 0.38.
rusqlite = { version = "=0.39", features = ["bundled"] }
rustyline = "18.0.1"
same-file = "1.0"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "uuid",
    "postgres",
    "runtime-tokio",
    "sqlx-toml",
    "rust_decimal",
] }
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full", "tracing"] }
tokio-stream = "0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = { version = "0.2.5" }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.0"
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
    "grpc-tonic",
    "trace",
] }
urlencoding = "2.1.3"
uuid = { version = "1.26.1", features = ["v4", "js"] }
zeroize = "1"
yup-oauth2 = { version = "12.1.2", features = [
    "hyper-rustls",
    "service-account",
    "ring",
] }

[profile.dev]
opt-level = 1

[profile.ci]
inherits = "dev"

[profile.release]
opt-level = 3
lto = true

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
